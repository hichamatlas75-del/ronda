<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uno Maroc Authentique - Carta Sghira</title>
<meta name="description" content="Jeu Uno traditionnel marocain avec les véritables cartes espagnoles Carta Sghira, voix en Darija et mode hors-ligne.">
<meta name="theme-color" content="#062326">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #061d1f;
  --felt: #0c393c;
  --felt-dark: #062326;
  --felt-border: #164f54;
  --fg: #f5f2e9;
  --fg-dim: #cbd5cb;
  --accent: #f5c542;
  --accent-glow: rgba(245, 197, 66, 0.45);
  --btn: #f5c542;
  --btnfg: #291c00;
  --danger: #e04848;
  --success: #3ecf8e;
  --copas: #c0262d;
  --oros: #b98a00;
  --bastos: #1f7a3a;
  --espadas: #1f4e9c;
  --card-w: clamp(54px, 15.5vw, 82px);
  --card-h: calc(var(--card-w) * 1.533);
  --card-radius: 6px;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px 10px 24px;
}

header, .w {
  width: min(98vw, 680px);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 4px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand h1 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--fg);
}

.brand-badge {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: rgba(245, 197, 66, 0.18);
  color: var(--accent);
  border: 1px solid rgba(245, 197, 66, 0.4);
  padding: 2px 8px;
  border-radius: 999px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

select, button {
  font: inherit;
  border: 0;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 0.85rem;
  cursor: pointer;
}

select {
  background: rgba(0, 0, 0, 0.4);
  color: var(--fg);
  border: 1px solid rgba(255, 255, 255, 0.15);
  font-weight: 600;
}

button {
  background: var(--btn);
  color: var(--btnfg);
  font-weight: 700;
  transition: transform 0.1s ease, filter 0.1s ease;
}

button:active {
  transform: scale(0.96);
}

button:disabled {
  opacity: 0.35;
  cursor: default;
  transform: none;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.12);
  color: var(--fg);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--fg);
  font-size: 1.1rem;
}

/* Nav Tabs */
.app-tabs {
  display: flex;
  gap: 6px;
  background: rgba(0, 0, 0, 0.4);
  padding: 4px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  margin-bottom: 4px;
}

.app-tab-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--fg-dim);
  font-weight: 700;
  font-size: 0.88rem;
  text-decoration: none;
}

.app-tab-btn.active {
  background: var(--accent);
  color: var(--btnfg);
  box-shadow: 0 2px 8px var(--accent-glow);
}

/* Scoreboard */
#scoreboard {
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.score-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.score-num {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--accent);
}

/* Opponents Bar */
#opps {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.op {
  position: relative;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 999px;
  padding: 5px 12px;
  text-align: center;
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.op.t {
  border-color: var(--accent);
  background: rgba(245, 197, 66, 0.22);
  color: #fff;
  box-shadow: 0 0 16px var(--accent-glow);
  transform: scale(1.04);
  animation: pulseOpponent 1.2s infinite alternate ease-in-out;
}

@keyframes pulseOpponent {
  0% { box-shadow: 0 0 6px var(--accent-glow); transform: scale(1.02); }
  100% { box-shadow: 0 0 18px var(--accent-glow), 0 0 0 2px var(--accent); transform: scale(1.05); }
}

.op-thinking {
  display: inline-block;
  animation: bounceThinking 0.7s infinite alternate ease-in-out;
  margin-left: 3px;
}

@keyframes bounceThinking {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-4px) scale(1.15); }
}

.uno-shout-badge {
  position: absolute;
  top: -14px;
  right: -8px;
  background: #e04848;
  color: #fff;
  font-weight: 900;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border-radius: 999px;
  border: 2px solid #fff;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  animation: popBadge 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  pointer-events: none;
  z-index: 20;
}

@keyframes popBadge {
  0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.card-land {
  animation: landBounce 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes landBounce {
  0% { transform: scale(1.08) translateY(-4px); }
  100% { transform: scale(1) translateY(0); }
}

/* Moroccan Table / Felt */
#mid {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 16px;
  border-radius: 20px;
  border: 4px solid #5a3418;
  box-shadow: 0 0 0 2px var(--accent), inset 0 0 45px rgba(0, 0, 0, 0.55);
  background: radial-gradient(ellipse at center, #0e3d40 0%, #061d1f 100%);
  min-height: calc(var(--card-h) + 30px);
}

/* Authentic Playing Card Component */
.card {
  width: var(--card-w);
  height: var(--card-h);
  background: #fff;
  border-radius: var(--card-radius);
  box-shadow: 0 3px 8px rgba(0,0,0,0.45);
  position: relative;
  user-select: none;
  transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease, filter 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  border-radius: var(--card-radius);
  display: block;
  pointer-events: none;
}

/* Action Badges */
.uno-badge {
  position: absolute;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(16, 44, 88, 0.92);
  color: #fff;
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 2px 7px;
  font-size: clamp(8px, 2.2vw, 11px);
  font-weight: 800;
  white-space: nowrap;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  pointer-events: none;
}

.uno-badge.rey, .uno-badge.d4 { background: #c0262d; }
.uno-badge.sota { background: #102c58; }
.uno-badge.caballo { background: #1f7a3a; }
.uno-badge.wild { background: #b98a00; }

.card.back {
  box-shadow: 0 4px 10px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.1);
}

#pile {
  cursor: pointer;
  position: relative;
}

#pile::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: calc(var(--card-radius) + 2px);
  border: 2px dashed rgba(245, 197, 66, 0.4);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

#pile:hover::after {
  opacity: 1;
}

/* Active Color Indicator Medallion */
#cur {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  border: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 12px var(--accent-glow);
  padding: 4px;
}

#cur svg {
  width: 80%;
  height: 80%;
}

/* Player Hand */
#hand {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  min-height: calc(var(--card-h) + 16px);
  padding: 8px 4px;
}

.card.ok {
  cursor: pointer;
  transform: translateY(-8px);
  box-shadow: 0 0 0 2.5px var(--accent), 0 8px 16px rgba(0,0,0,0.55);
}

.card.ok:hover {
  transform: translateY(-14px) scale(1.04);
}

.card.no {
  filter: brightness(0.6) contrast(0.9);
  opacity: 0.75;
}

/* Action Controls */
#acts {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
}

#uno {
  font-size: 1.1rem;
  padding: 8px 24px;
}

#uno.on {
  background: #e53935;
  color: #fff;
  box-shadow: 0 0 16px rgba(229, 57, 53, 0.8);
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.06); }
}

#msg {
  min-height: 3.2em;
  text-align: center;
  font-size: 0.95rem;
  line-height: 1.35;
  color: var(--fg-dim);
}

#msg b {
  color: var(--accent);
}

/* Overlays / Modals */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  backdrop-filter: blur(4px);
}

.ov > div {
  background: #092328;
  border: 2px solid var(--accent);
  padding: 22px 26px;
  border-radius: 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 90vw;
  box-shadow: 0 12px 30px rgba(0,0,0,0.7);
}

#cp {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

#cp button {
  height: 80px;
  width: 90px;
  border-radius: 14px;
  background: #fff;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid transparent;
  gap: 4px;
}

#cp button:hover {
  border-color: var(--accent);
  transform: scale(1.05);
}

#cp svg {
  height: 44px;
  width: 44px;
}

#cp span {
  font-size: 0.75rem;
  font-weight: 800;
  color: #222;
}
</style>
</head>

<script>
const SUIT = { R: "copas", Y: "oros", G: "bastos", B: "espadas" };
const SUIT_AR = { copas: "الكواص", oros: "الذهب", bastos: "الزرواطة", espadas: "السيوف" };
const SUIT_OFFSET = { copas: 0, oros: 10, bastos: 20, espadas: 30 };
const NAMES = ["Toi", "Simo", "Yassine", "Salma"];
const NAMES_AR = ["أنت", "سيمو", "ياسين", "سلمى"];

const FACE = {
  S: { n: "10", nm: "SOTA", arNm: "الشيخ", bd: "⊘ PASSE", arBd: "⊘ دوز", cls: "sota" },
  R: { n: "11", nm: "CABALLO", arNm: "العود", bd: "⇄ SENS", arBd: "⇄ بدل", cls: "caballo" },
  D2: { n: "12", nm: "REY", arNm: "الملك", bd: "+2", arBd: "+2", cls: "rey" }
};

let currentLang = 'ar';
try {
  const urlParams = new URLSearchParams(window.location.search);
  const qLang = urlParams.get('lang');
  if (qLang === 'ar' || qLang === 'fr') {
    currentLang = qLang;
  } else {
    const savedChoice = localStorage.getItem('ronda_lang_user_choice');
    if (savedChoice === 'fr' || savedChoice === 'ar') currentLang = savedChoice;
    else currentLang = 'ar';
  }
} catch (e) {}
let g, busy = false, log = [], gen = 0, unoOn = false, pending = null;

const CADENCE_CONFIG = {
  reelle: { thinkMin: 1200, thinkMax: 1700, animFlight: 380, observe: 950, drawPause: 700 },
  calme:  { thinkMin: 1800, thinkMax: 2600, animFlight: 480, observe: 1400, drawPause: 1000 },
  rapide: { thinkMin: 350,  thinkMax: 550,  animFlight: 200, observe: 300, drawPause: 200 }
};

function getCadence() {
  const el = $("cadence");
  const key = el ? el.value : "reelle";
  return CADENCE_CONFIG[key] || CADENCE_CONFIG.reelle;
}

function delay(ms) {
  return new Promise(res => setTimeout(res, ms));
}

function animateUnoFlight(fromEl, toEl, cardId, isBack = false, duration = 380) {
  return new Promise(resolve => {
    if (!fromEl || !toEl) return resolve();
    const r1 = fromEl.getBoundingClientRect();
    const r2 = toEl.getBoundingClientRect();
    if (!r1.width || !r2.width) return resolve();

    const fly = document.createElement("div");
    fly.className = "card card-flying";
    fly.style.position = "fixed";
    fly.style.zIndex = "9999";
    fly.style.left = `${r1.left}px`;
    fly.style.top = `${r1.top}px`;
    fly.style.width = `${r1.width || 72}px`;
    fly.style.height = `${r1.height || 108}px`;
    fly.style.pointerEvents = "none";
    fly.style.transition = `all ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
    fly.style.boxShadow = "0 14px 28px rgba(0,0,0,0.5)";

    const img = document.createElement("img");
    if (isBack || cardId == null) {
      img.src = "cards/back.png";
    } else {
      const c = Uno.CARDS[cardId];
      img.src = getCardSrc(c);
    }
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.borderRadius = "8px";
    fly.appendChild(img);

    document.body.appendChild(fly);
    fly.getBoundingClientRect();

    const targetW = r2.width || r1.width || 72;
    const targetH = r2.height || r1.height || 108;
    fly.style.left = `${r2.left}px`;
    fly.style.top = `${r2.top}px`;
    fly.style.width = `${targetW}px`;
    fly.style.height = `${targetH}px`;
    fly.style.transform = `scale(1.05) rotate(${(Math.random() - 0.5) * 8}deg)`;

    setTimeout(() => {
      if (fly.parentNode) fly.parentNode.removeChild(fly);
      resolve();
    }, duration + 30);
  });
}

function showUnoShout(playerIdx) {
  const target = playerIdx === 0 ? $("hand") : $("op-" + playerIdx);
  if (!target) return;
  const badge = document.createElement("div");
  badge.className = "uno-shout-badge";
  badge.textContent = "UNO !";
  target.style.position = "relative";
  target.appendChild(badge);
  setTimeout(() => {
    if (badge.parentNode) badge.parentNode.removeChild(badge);
  }, 1200);
}

const $ = id => document.getElementById(id);
const use = (s, x) => `<svg ${x||""}><use href="#${s}"/></svg>`;

function getCardSrc(c) {
  if (c.color === "W") return c.value === "D4" ? "cards/wild_d4.png" : "cards/wild.png";
  const s = SUIT[c.color];
  if (c.value === "0") return `cards/${s}_0.png`;
  if (c.value >= "1" && c.value <= "7") {
    const r = parseInt(c.value, 10);
    return `cards/${SUIT_OFFSET[s] + (r - 1)}.png`;
  }
  if (c.value === "8") return `cards/${s}_8.png`;
  if (c.value === "9") return `cards/${s}_9.png`;
  if (c.value === "S") return `cards/${SUIT_OFFSET[s] + 7}.png`;
  if (c.value === "R") return `cards/${SUIT_OFFSET[s] + 8}.png`;
  if (c.value === "D2") return `cards/${SUIT_OFFSET[s] + 9}.png`;
  return "cards/back.png";
}

function cardEl(id) {
  const c = Uno.CARDS[id];
  const e = document.createElement("div");
  e.className = "card";
  e.setAttribute("data-id", id);
  
  const img = document.createElement("img");
  img.src = getCardSrc(c);
  img.alt = label(id);
  e.appendChild(img);

  // Overlay badge for action cards
  if (c.color === "W") {
    const badge = document.createElement("span");
    badge.className = "uno-badge " + (c.value === "D4" ? "d4" : "wild");
    badge.textContent = c.value === "D4" ? "+4" : "★";
    e.appendChild(badge);
  } else if (FACE[c.value]) {
    const f = FACE[c.value];
    const badge = document.createElement("span");
    badge.className = "uno-badge " + f.cls;
    badge.textContent = currentLang === 'ar' ? f.arBd : f.bd;
    e.appendChild(badge);
  }
  return e;
}

function label(id) {
  const c = Uno.CARDS[id], f = FACE[c.value];
  if (c.color === "W") return c.value === "D4" ? (currentLang === 'ar' ? "جوكير +4" : "Joker +4") : (currentLang === 'ar' ? "جوكير" : "Joker");
  const sName = currentLang === 'ar' ? SUIT_AR[SUIT[c.color]] : SUIT[c.color];
  const fName = f ? (currentLang === 'ar' ? f.arNm : f.nm) : c.value;
  return currentLang === 'ar' ? `${fName} د ${sName}` : `${fName} de ${sName}`;
}

function say(ev) {
  for (const e of ev) {
    const pName = currentLang === 'ar' ? NAMES_AR[e.player] : NAMES[e.player];
    if (e.type === "play" && e.player !== 0) {
      const c = Uno.CARDS[e.card];
      const sDesc = c.color === "W" ? (currentLang === 'ar' ? " → " + SUIT_AR[SUIT[e.color]] : " → " + SUIT[e.color]) : "";
      log.push(currentLang === 'ar' ? `${pName} لعب ${label(e.card)}${sDesc}` : `${pName} joue ${label(e.card)}${sDesc}.`);
      try {
        RondaSound.playSFX('slap');
        if (c.value === "SOTA") {
          setTimeout(() => { RondaSound.playSFX('block'); RondaSound.say('skip'); }, 140);
        } else if (c.value === "CABALLO") {
          setTimeout(() => { RondaSound.playSFX('swoosh'); RondaSound.say('reverse'); }, 140);
        } else if (c.value === "REY") {
          setTimeout(() => RondaSound.say('draw2'), 140);
        } else if (c.value === "D4") {
          setTimeout(() => RondaSound.say('draw4'), 140);
        } else if (c.value === "W") {
          setTimeout(() => RondaSound.say('wild'), 140);
        }
      } catch(err) {}
    } else if (e.type === "draw" && e.count) {
      if (e.player === 0) {
        log.push(currentLang === 'ar' ? `تيريتي ${e.count} كارطة` : `Tu pioches ${e.count} carte${e.count > 1 ? "s" : ""}.`);
      } else {
        log.push(currentLang === 'ar' ? `${pName} تيرى ${e.count} كارطة` : `${pName} pioche ${e.count} carte${e.count > 1 ? "s" : ""}.`);
      }
      try { RondaSound.playSFX('deal'); } catch(err) {}
    } else if (e.type === "uno") {
      log.push(currentLang === 'ar' ? `${pName} : أونو !` : `${pName} : UNO !`);
      try {
        RondaSound.playSFX('alert');
        setTimeout(() => RondaSound.say('uno'), 100);
      } catch(err) {}
    } else if (e.type === "unoMissed" && e.player === 0) {
      log.push(currentLang === 'ar' ? "نسيتي أونو ! : +2 كارطات عقوبة" : "Tu as oublié UNO ! : +2 cartes");
      try {
        RondaSound.playSFX('block');
        setTimeout(() => RondaSound.say('uno_missed'), 120);
      } catch(err) {}
    } else if (e.type === "reverse") {
      log.push(currentLang === 'ar' ? "تبدلات الدورة ⇄" : "Changement de sens ⇄");
    } else if (e.type === "skip") {
      const victim = currentLang === 'ar' ? NAMES_AR[e.player] : NAMES[e.player];
      log.push(currentLang === 'ar' ? `${victim} داز تور ديالو ⊘` : `${victim} passe son tour ⊘`);
    } else if (e.type === "roundEnd") {
      const wName = currentLang === 'ar' ? NAMES_AR[e.winner] : NAMES[e.winner];
      $("et").textContent = e.winner === 0 
        ? (currentLang === 'ar' ? "ربحتي الشوط ! 🎉" : "Manche gagnée ! 🎉") 
        : (currentLang === 'ar' ? `${wName} ربح الشوط` : `${wName} gagne la manche`);
      $("ep").textContent = "+" + e.points + " pts · " + e.scores.map((s, i) => (currentLang === 'ar' ? NAMES_AR[i] : NAMES[i]) + " " + s).join(" · ");
      $("nx").style.display = "";
      $("end").style.display = "flex";
      try {
        RondaSound.playSFX('chime');
        setTimeout(() => RondaSound.say(e.winner === 0 ? 'uno_win' : 'uno_lose'), 200);
      } catch(err) {}
    } else if (e.type === "gameOver") {
      const wName = currentLang === 'ar' ? NAMES_AR[e.winner] : NAMES[e.winner];
      $("et").textContent = e.winner === 0 
        ? (currentLang === 'ar' ? "ربحتي الطرح كامل ! 🏆" : "Tu as gagné la partie ! 🏆") 
        : (currentLang === 'ar' ? `${wName} ربح الطرح 🏆` : `${wName} gagne la partie`);
      $("nx").style.display = "none";
      try {
        RondaSound.playSFX('chime');
        setTimeout(() => RondaSound.say(e.winner === 0 ? 'uno_win' : 'uno_lose'), 200);
      } catch(err) {}
    }
  }
  log = log.slice(-3);
}

function render(thinkingPlayer = null) {
  if (!g) return;
  const v = g.view(0);
  $("score-me").textContent = v.scores[0];
  const maxOpp = Math.max(...v.scores.slice(1));
  $("score-leader").textContent = maxOpp;
  const oppLabelEl = $("lbl-opp-score");
  if (oppLabelEl) {
    if (v.counts.length === 2) {
      oppLabelEl.textContent = currentLang === 'ar' ? NAMES_AR[1] : NAMES[1];
    } else {
      oppLabelEl.textContent = currentLang === 'ar' ? "المتصدر" : "Leader";
    }
  }
  $("round-num").textContent = v.round;

  // Opponents
  $("opps").innerHTML = v.counts.map((n, i) => {
    if (!i) return "";
    const name = currentLang === 'ar' ? NAMES_AR[i] : NAMES[i];
    const isTurn = v.turn === i && !v.roundOver;
    const isThinking = thinkingPlayer === i;
    return `<div id="op-${i}" class="op${isTurn ? " t" : ""}"><b>${name}</b> ${n} 🂠 · ${v.scores[i]} pts${isThinking ? ' <span class="op-thinking">🤔</span>' : ''}</div>`;
  }).join("");

  // Top Card
  $("top").innerHTML = "";
  const topEl = cardEl(v.top);
  topEl.classList.add("card-land");
  $("top").appendChild(topEl);

  // Color Indicator
  $("cur").innerHTML = use(SUIT[v.color]);

  // Hand
  const h = $("hand");
  h.innerHTML = "";
  const mine = v.turn === 0 && !v.roundOver && !v.over && !busy;
  v.hand.forEach(id => {
    const e = cardEl(id);
    const ok = mine && v.legal.includes(id);
    e.classList.add(ok ? "ok" : "no");
    if (ok) {
      e.onclick = (ev) => {
        if (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        }
        humanPlay(id);
      };
    }
    h.appendChild(e);
  });

  $("pass").disabled = !(mine && v.drawn != null);
  $("uno").classList.toggle("on", unoOn);
  $("pile").style.opacity = mine && v.drawn == null ? "1" : "0.55";

  // Status message
  let promptText = "";
  if (mine) {
    promptText = v.drawn != null 
      ? (currentLang === 'ar' ? "<br><b>لعب الكارطة اللي تيريتي ولا دوز</b>" : "<br><b>Joue la carte piochée ou passe</b>")
      : (currentLang === 'ar' ? "<br><b>نوبتك تلعب !</b>" : "<br><b>À toi de jouer !</b>");
  }
  $("msg").innerHTML = log.join("<br>") + promptText;
}

async function humanPlay(id, color) {
  if (busy) return;
  const c = Uno.CARDS[id];
  if (c.color === "W" && !color) {
    pending = id;
    $("colors").style.display = "flex";
    return;
  }
  busy = true;
  const cad = getCadence();

  const handCardEl = $("hand").querySelector(`[data-id="${id}"]`);
  if (handCardEl) {
    await animateUnoFlight(handCardEl, $("top"), id, false, cad.animFlight);
  }

  try {
    if (typeof RondaSound !== 'undefined') {
      RondaSound.playSFX('slap');
      if (c.value === "SOTA") {
        setTimeout(() => { RondaSound.playSFX('block'); RondaSound.say('skip'); }, 140);
      } else if (c.value === "CABALLO") {
        setTimeout(() => { RondaSound.playSFX('swoosh'); RondaSound.say('reverse'); }, 140);
      } else if (c.value === "REY") {
        setTimeout(() => RondaSound.say('draw2'), 140);
      } else if (c.value === "D4") {
        setTimeout(() => RondaSound.say('draw4'), 140);
      } else if (c.value === "W") {
        setTimeout(() => RondaSound.say('wild'), 140);
      }
    }
  } catch(e) {}

  const events = g.play(0, id, color || null, unoOn);
  if (unoOn) showUnoShout(0);
  unoOn = false;
  say(events);
  render();

  if (events.some(e => e.type === "roundEnd" || e.type === "gameOver")) {
    busy = false;
    return;
  }

  await delay(cad.observe);
  loop();
}

async function stepAI(curGen) {
  if (curGen !== gen || !g || g.over || g.roundOver || g.turn === 0) {
    busy = false;
    render();
    return;
  }
  busy = true;
  const curP = g.turn;
  const cad = getCadence();

  render(curP);
  const thinkTime = cad.thinkMin + Math.floor(Math.random() * (cad.thinkMax - cad.thinkMin));
  await delay(thinkTime);
  if (curGen !== gen || !g) return;

  const events = g.aiStep();

  for (const ev of events) {
    if (ev.type === "draw" && ev.player === curP) {
      try { RondaSound.playSFX('deal'); } catch(err) {}
      const opEl = $("op-" + curP);
      if (opEl) {
        await animateUnoFlight($("pile"), opEl, null, true, cad.animFlight);
      }
      await delay(cad.drawPause);
    } else if (ev.type === "play" && ev.player === curP) {
      const opEl = $("op-" + curP);
      if (opEl) {
        await animateUnoFlight(opEl, $("top"), ev.card, false, cad.animFlight);
      }
    } else if (ev.type === "uno") {
      showUnoShout(ev.player);
    }
  }

  say(events);
  render();

  if (g.over || g.roundOver) {
    busy = false;
    return;
  }

  await delay(cad.observe);
  if (curGen !== gen) return;

  if (g.turn === 0) {
    busy = false;
    render();
  } else {
    stepAI(curGen);
  }
}

function loop() {
  if (!g || g.over || g.roundOver || g.turn === 0) {
    busy = false;
    render();
    return;
  }
  stepAI(gen);
}

$("pile").onclick = async () => {
  if (busy || g.turn !== 0 || g.roundOver || g.over || g.drawn != null) return;
  busy = true;
  const cad = getCadence();
  try { RondaSound.playSFX('deal'); } catch(err) {}
  await animateUnoFlight($("pile"), $("hand"), null, true, cad.animFlight);
  say(g.draw1(0));
  busy = false;
  render();
  if (g.drawn == null) {
    loop();
  }
};

$("pass").onclick = () => {
  if (g.turn !== 0 || g.drawn == null) return;
  say(g.pass(0));
  render();
  loop();
};

$("uno").onclick = () => {
  unoOn = !unoOn;
  if (unoOn) {
    try {
      RondaSound.playSFX('alert');
      setTimeout(() => RondaSound.say('uno'), 100);
    } catch(err) {}
  }
  render();
};

$("cp").innerHTML = ["R", "Y", "G", "B"].map(c => `
  <button data-c="${c}">
    ${use(SUIT[c], 'style="pointer-events:none"')}
    <span>${SUIT[c].toUpperCase()}</span>
  </button>
`).join("");

$("cp").onclick = e => {
  const b = e.target.closest("button");
  if (!b || pending == null) return;
  $("colors").style.display = "none";
  const id = pending;
  pending = null;
  humanPlay(id, b.dataset.c);
};

$("nx").onclick = () => {
  $("end").style.display = "none";
  g.nextRound();
  log = [];
  loop();
};

function start() {
  gen++;
  busy = false;
  log = [];
  unoOn = false;
  $("end").style.display = "none";
  g = new Uno.Game({
    players: +$("np").value,
    difficulty: $("lv").value,
    target: 500
  });
  say(g.drain());
  loop();
}

$("nw").onclick = start;
$("np").onchange = start;
$("lv").onchange = start;

// Sound toggle
let soundOn = true;
$("btn-sound").onclick = () => {
  soundOn = !soundOn;
  RondaSound.setVolume(soundOn ? 0.8 : 0);
  $("btn-sound").textContent = soundOn ? "🔊" : "🔇";
};

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', currentLang);
  $("btn-lang").textContent = currentLang === 'ar' ? "🇫🇷 FR" : "🇲🇦 دارجة";
  $("lbl-ronda").textContent = currentLang === 'ar' ? "روندا المغربية" : "Ronda Maroc";
  $("lbl-uno").textContent = currentLang === 'ar' ? "أونو مغربي" : "Uno Maroc";
  $("lbl-you").textContent = currentLang === 'ar' ? "أنت" : "Toi";
  $("lbl-round").textContent = currentLang === 'ar' ? "الشوط" : "Manche";
  $("lbl-target").textContent = currentLang === 'ar' ? "الهدف" : "Objectif";
  $("lbl-pick-color").textContent = currentLang === 'ar' ? "عزل اللون" : "Choisis une couleur";
  $("pass").textContent = currentLang === 'ar' ? "دوز" : "Passer";
  $("nw").textContent = currentLang === 'ar' ? "طرح جديد" : "Nouvelle";
  $("nx").textContent = currentLang === 'ar' ? "الشوط الموالي" : "Manche suivante";
  const cadOpts = $("cadence").options;
  const npOpts = $("np").options;
  if (currentLang === 'ar') {
    cadOpts[0].text = "⏱️ وتيرة حقيقية";
    cadOpts[1].text = "☕ مرتاحة";
    cadOpts[2].text = "⚡ سريعة";
    npOpts[0].text = "1 روبوت (1 ضد 1)";
    npOpts[1].text = "2 روبوتات (3 لعابة)";
    npOpts[2].text = "3 روبوتات (4 لعابة)";
    try { RondaSound.setVoiceLanguage('darija'); } catch(e) {}
  } else {
    cadOpts[0].text = "⏱️ Cadence Réelle";
    cadOpts[1].text = "☕ Détendue";
    cadOpts[2].text = "⚡ Rapide";
    npOpts[0].text = "1 Robot (1 vs 1)";
    npOpts[1].text = "2 Robots (3 Joueurs)";
    npOpts[2].text = "3 Robots (4 Joueurs)";
    try { RondaSound.setVoiceLanguage('fr'); } catch(e) {}
  }
  render();
}

$("btn-lang").onclick = () => {
  const newLang = currentLang === 'fr' ? 'ar' : 'fr';
  try { localStorage.setItem('ronda_lang_user_choice', newLang); } catch(e) {}
  applyLang(newLang);
};

start();
applyLang(currentLang);
</script>
</body>
</html>
